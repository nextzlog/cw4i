name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --no-default-features --all-targets -- -D warnings
      - run: cargo test --workspace

  Linux:
    needs: Test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo build --release -p cw4i-ui
      - run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          [ "$(head -c 4 appimagetool | od -An -c | tr -d ' ')" = '177ELF' ] || { echo "appimagetool is not an ELF binary"; exit 1; }
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 APPIMAGETOOL=$PWD/appimagetool scripts/linux.sh CW4ISR cw4i
          cp dist/cw4i-x86_64.AppImage .
          gh release create nightly --prerelease --title nightly --notes "Built from master." || true
          gh release upload nightly cw4i-x86_64.AppImage --clobber

  MacOS:
    needs: Test
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo build --release -p cw4i-ui --target aarch64-apple-darwin
      - run: cargo build --release -p cw4i-ui --target x86_64-apple-darwin
      - run: |
          scripts/macos.sh CW4ISR cw4i \
            target/aarch64-apple-darwin/release/cw4i \
            target/x86_64-apple-darwin/release/cw4i
          ln -s /Applications dist/Applications
          for n in 1 2 3; do
            hdiutil create -volname CW4ISR -srcfolder dist -ov -format UDZO cw4i.dmg && break
            [ $n = 3 ] && exit 1
            sleep 10
          done
          gh release create nightly --prerelease --title nightly --notes "Built from master." || true
          gh release upload nightly cw4i.dmg --clobber

  Windows:
    needs: Test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p cw4i-ui
      - run: |
          copy target\release\cw4i.exe cw4i.exe
          gh release create nightly --prerelease --title nightly --notes "Built from master." || ver > nul
          gh release upload nightly cw4i.exe --clobber
        shell: cmd
